name: narrative_collector

# Colector de menciones (doc 26, Fase 0) — script_115. Cada 20 min, desfasado del pipeline (minutos 7/27/47).
# Solo GET de lectura a endpoints públicos (RSS, JSON públicos, vista web de canales públicos de Telegram), con
# las familias que la sonda marcó OK. Sin secretos, sin cuentas ni cookies, sin envíos a Telegram.
# NO toca script_82, script_97 ni el score. Commitea únicamente 02_Analisis/narrative/.

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ops-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Collect mentions
        env:
          SHOT_ROOT: ${{ github.workspace }}
          PYTHONIOENCODING: utf-8
        run: |
          python 04_Config/scripts/script_115_narrative_collector.py

      - name: Commit narrative state
        run: |
          git config user.name "shot-de-mercado-bot"
          git config user.email "bot@shotdemercado.local"
          git add -- 02_Analisis/narrative
          if git diff --staged --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "narrative_collector: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4; do
            if git pull -q --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 15))
          done
          echo "::error::No se pudo pushear 02_Analisis/narrative tras 4 intentos"
          exit 1
