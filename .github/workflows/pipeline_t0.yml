name: pipeline_t0

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline_t0:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv websockets

      - name: Diagnostic before
        run: |
          echo "=== Working directory ==="
          pwd
          echo "=== Scripts available ==="
          ls 04_Config/scripts/ | head -20
          echo "=== shadow_v4 accumulated size ==="
          ls -la 02_Analisis/shadow_v4/_accumulated.json 2>/dev/null || echo "FILE_NOT_FOUND"

      - name: Run pipeline T+0
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MADEONSOL_API_KEY: ${{ secrets.MADEONSOL_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SHOT_ROOT: ${{ github.workspace }}
        run: |
          python 04_Config/scripts/script_82_final_detection.py

      - name: Diagnostic after
        run: |
          echo "=== shadow_v4 accumulated size after ==="
          ls -la 02_Analisis/shadow_v4/_accumulated.json 2>/dev/null || echo "FILE_NOT_FOUND"
          echo "=== _all_alerts.json size after ==="
          ls -la 02_Analisis/alerts/_all_alerts.json 2>/dev/null || echo "FILE_NOT_FOUND"

      - name: Commit state changes
        run: |
          git config user.name "shot-de-mercado-bot"
          git config user.email "bot@shotdemercado.local"
          git add -A
          if git diff --staged --quiet; then
            echo "No hay cambios para commitear"
          else
            git commit -m "pipeline_t0 auto: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi