name: telegram_test_send

# Prueba MANUAL de los destinos de Telegram de script_97 (chat personal + grupo de usuarios).
# Manda UN mensaje marcado como prueba a cada destino configurado. No emite alertas, no lee candidatos
# y no commitea nada. Solo se dispara a mano (workflow_dispatch).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_send:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Test send
        env:
          SHOT_ROOT: ${{ github.workspace }}
          PYTHONIOENCODING: utf-8
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
        run: |
          python 04_Config/scripts/script_97_emit_alerts.py --test-send
