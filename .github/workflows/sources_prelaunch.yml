name: sources_prelaunch

# Calendario de activos no nacidos (D-079; diseño D-078). Reemplaza a prelaunch.yml + script_99 (deprecados).
# Cada 6 h: Hyperliquid, Aevo, Polymarket, Bybit, Binance CMS y Bitcointalk → 02_Analisis/prelaunch/_calendar.json.
# Solo GET/POST públicos, sin secretos ni envíos a Telegram. Commitea SOLO sus archivos (nunca git add -A):
#   02_Analisis/prelaunch/                       calendario y salud (dueño único)
#   02_Analisis/events/prelaunch_calendar/       eventos emitidos (lib_events)
#   02_Analisis/events/_cursors/prelaunch_calendar.json   cursor de token_nacido
#   02_Analisis/sources/_episodes_prelaunch.jsonl          activos cerrados (memoria episódica)

on:
  schedule:
    - cron: '25 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sources-prelaunch-write
  cancel-in-progress: false

jobs:
  calendar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml
          pip install --require-hashes --no-deps -r requirements-dev.txt

      - name: Prelaunch calendar
        env:
          SHOT_ROOT: ${{ github.workspace }}
          PYTHONIOENCODING: utf-8
        run: |
          python 04_Config/scripts/bot_prelaunch_calendar.py

      - name: Commit prelaunch
        run: |
          git config user.name "shot-de-mercado-bot"
          git config user.email "bot@shotdemercado.local"
          for p in 02_Analisis/prelaunch 02_Analisis/events/prelaunch_calendar \
                   02_Analisis/events/_cursors/prelaunch_calendar.json 02_Analisis/sources/_episodes_prelaunch.jsonl; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done
          if git diff --staged --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "sources_prelaunch: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4; do
            if git pull -q --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 15))
          done
          echo "::error::No se pudo pushear 02_Analisis/prelaunch tras 4 intentos"
          exit 1
