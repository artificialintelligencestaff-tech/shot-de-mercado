name: health_check_bot

# Bot gemelo: fallas silenciosas (cada 2 h). Solo LEE la API de Actions.
# >= 2 fallas seguidas, pipeline_t0 sin éxito en 2 h, sin detecciones en 6 h, sin alertas en 24 h.
# Registra en _health_log.json; avisa al chat de OPERACIONES solo cuando cambia el conjunto de problemas.

on:
  schedule:
    - cron: '45 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ops-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run health check
        env:
          SHOT_ROOT: ${{ github.workspace }}
          PYTHONIOENCODING: utf-8
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OPS_CHAT_ID: ${{ secrets.TELEGRAM_OPS_CHAT_ID }}
        run: |
          python 04_Config/scripts/bot_health_check.py

      - name: Commit bot state
        run: |
          git config user.name "shot-de-mercado-bot"
          git config user.email "bot@shotdemercado.local"
          git add -- 02_Analisis/_health_log.json
          if git diff --staged --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "health_check bot: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4; do
            if git pull -q --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 15))
          done
          echo "::error::No se pudo pushear _health_log.json tras 4 intentos"
          exit 1
