name: sources_rss

# bot_rss_news (doc 34) — 12 feeds RSS cada 20 min (minutos 3/23/43: fuera del pipeline, early watch y script_115).
# Solo GET públicos, sin secretos ni envíos. Commitea únicamente 02_Analisis/sources/rss/.
# Plantilla de los workflows de bots de fuentes: cambian name, cron, script y carpeta.

on:
  schedule:
    - cron: '3,23,43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sources-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Collect RSS
        env:
          SHOT_ROOT: ${{ github.workspace }}
          PYTHONIOENCODING: utf-8
        run: |
          python 04_Config/scripts/bot_rss_news.py

      - name: Commit sources/rss
        run: |
          git config user.name "shot-de-mercado-bot"
          git config user.email "bot@shotdemercado.local"
          git add -- 02_Analisis/sources/rss
          if git diff --staged --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "sources_rss: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4; do
            if git pull -q --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 15))
          done
          echo "::error::No se pudo pushear 02_Analisis/sources/rss tras 4 intentos"
          exit 1
