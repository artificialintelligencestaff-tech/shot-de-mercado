name: probe_inventario

# Sonda manual del inventario del doc 28 (Fase 8, T2) desde las IPs de Actions: una request por servicio.
# Solo GET (o POST de lectura para GraphQL / JSON-RPC) a endpoints públicos, sin keys ni cuentas.
# No toca el pipeline ni ningún score. Sin instalar nada más que requests.
# Commitea únicamente 02_Analisis/diagnostics/inventario_probe.json (y lo publica como artifact).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ops-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Probe inventory
        env:
          SHOT_ROOT: ${{ github.workspace }}
          PYTHONIOENCODING: utf-8
        run: |
          python 04_Config/scripts/probe_inventario.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventario-probe
          path: 02_Analisis/diagnostics/inventario_probe.json
          if-no-files-found: warn

      - name: Commit report
        run: |
          git config user.name "shot-de-mercado-bot"
          git config user.email "bot@shotdemercado.local"
          git add -- 02_Analisis/diagnostics/inventario_probe.json
          if git diff --staged --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "probe_inventario: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4; do
            if git pull -q --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 15))
          done
          echo "::error::No se pudo pushear inventario_probe.json tras 4 intentos"
          exit 1
