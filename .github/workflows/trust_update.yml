name: trust_update

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write-main
  cancel-in-progress: false

jobs:
  trust_update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Diagnostic before
        run: |
          echo "=== SHOT_ROOT ==="
          echo "$SHOT_ROOT"
          echo "=== _all_alerts.json size ==="
          ls -la 02_Analisis/alerts/_all_alerts.json || echo "FILE_NOT_FOUND"
          echo "=== _all_alerts.json content ==="
          cat 02_Analisis/alerts/_all_alerts.json || echo "FILE_NOT_FOUND"
        env:
          SHOT_ROOT: ${{ github.workspace }}

      - name: Run trust scheduler
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
          MADEONSOL_API_KEY: ${{ secrets.MADEONSOL_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          SHOT_ROOT: ${{ github.workspace }}
        run: |
          python 04_Config/scripts/script_98_trust_scheduler.py

      - name: Diagnostic after
        run: |
          echo "=== _all_alerts.json size after ==="
          ls -la 02_Analisis/alerts/_all_alerts.json || echo "FILE_NOT_FOUND"
          echo "=== trust_*.json files ==="
          ls -la 02_Analisis/alerts/trust_*.json 2>/dev/null || echo "NO_TRUST_FILES"

      - name: Commit state changes
        run: |
          git config user.name "shot-de-mercado-bot"
          git config user.email "bot@shotdemercado.local"
          git add -A
          if git diff --staged --quiet; then
            echo "No hay cambios para commitear"
          else
            git commit -m "trust_update auto: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main
            git push
          fi